<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#F2F2F7"
    >

    <title>Controle de Produção</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<header
    class="app-header"
    id="mainHeader"
>

    <div class="header-inner">

        <div>

            <div class="app-title">
                CONTROLE DE PRODUÇÃO
            </div>

            <div class="app-subtitle">
                Setor de Injeção
            </div>

        </div>


        <div class="header-actions">

            <div
                class="user-avatar"
                id="userAvatar"
            >
                --
            </div>

            <button
                class="logout-button"
                onclick="sair()"
                aria-label="Sair"
            >
                Sair
            </button>

        </div>

    </div>

</header>



<main>


    <!-- =====================================================
         CONTEXTO
    ====================================================== -->

    <section id="contextSection">

        <div class="leader-label">
            LÍDER
        </div>


        <div
            class="leader-name"
            id="leaderName"
        >
            Carregando...
        </div>


        <div class="context-grid">


            <div class="field-card context-date">

                <div class="field-label">
                    Data
                </div>

                <input
                    type="date"
                    id="date"
                >

            </div>


            <div class="field-card">

                <div class="field-label">
                    Turno
                </div>

                <select id="shift">

                    <option value="1º turno">
                        1º turno
                    </option>

                    <option value="2º turno">
                        2º turno
                    </option>

                    <option value="3º turno">
                        3º turno
                    </option>

                </select>

            </div>


            <div class="field-card">

                <div class="field-label">
                    Setor
                </div>

                <select id="sector">

                    <option value="A">
                        A
                    </option>

                    <option value="B">
                        B
                    </option>

                    <option value="C">
                        C
                    </option>

                </select>

            </div>


        </div>



        <section
            class="section"
            id="machineListSection"
        >

            <div class="section-title">
                Máquinas
            </div>


            <div
                class="machine-grid"
                id="machineGrid"
            ></div>

        </section>

    </section>



    <!-- =====================================================
         TELA DA MÁQUINA
    ====================================================== -->

    <section
        id="machineScreen"
        class="hidden"
    >


        <div class="machine-top">

            <button
                class="back-button"
                onclick="fecharTelaMaquina()"
                aria-label="Voltar"
            >
                ‹
            </button>


            <div>

                <div
                    class="machine-title"
                    id="machineTitle"
                >
                    M01
                </div>


                <div
                    class="machine-subtitle"
                    id="machineSubtitle"
                >
                    Apontamento da máquina
                </div>

            </div>

        </div>



        <!-- =================================================
             PRODUÇÃO
        ================================================== -->

        <div class="form-card">

            <div class="form-title">
                Produção
            </div>


            <div class="hours-grid">


                <div class="input-group">

                    <label for="goodHours">
                        Hora boa
                    </label>


                    <div class="time-input-wrapper">

                        <input
                            type="text"
                            id="goodHours"
                            inputmode="text"
                            placeholder="00:00"
                            maxlength="5"
                            autocomplete="off"
                        >


                        <button
                            type="button"
                            class="time-picker-button"
                            data-time-target="goodHours"
                            aria-label="Selecionar hora boa"
                            title="Selecionar hora"
                        >

                            <span class="clock-icon"></span>

                        </button>

                    </div>

                </div>



                <div class="input-group">

                    <label for="replacementHours">
                        Reposição
                    </label>


                    <div class="time-input-wrapper">

                        <input
                            type="text"
                            id="replacementHours"
                            inputmode="text"
                            placeholder="00:00"
                            maxlength="5"
                            autocomplete="off"
                        >


                        <button
                            type="button"
                            class="time-picker-button"
                            data-time-target="replacementHours"
                            aria-label="Selecionar reposição"
                            title="Selecionar hora"
                        >

                            <span class="clock-icon"></span>

                        </button>

                    </div>

                </div>


            </div>



            <div class="total-box">

                <div class="total-label">
                    Total baixado
                </div>


                <div
                    class="total-value"
                    id="totalHours"
                >
                    00:00
                </div>

            </div>



            <div class="performance">

                <div
                    class="performance-bar"
                    id="performanceBar"
                ></div>

            </div>



            <div class="saldo-row">

                <label for="balance">
                    Saldo
                </label>


                <div class="time-input-wrapper saldo-time">

                    <input
                        type="text"
                        id="balance"
                        inputmode="text"
                        placeholder="00:00"
                        maxlength="5"
                        autocomplete="off"
                    >


                    <button
                        type="button"
                        class="time-picker-button"
                        data-time-target="balance"
                        aria-label="Selecionar saldo"
                        title="Selecionar hora"
                    >

                        <span class="clock-icon"></span>

                    </button>

                </div>

            </div>


        </div>



        <!-- =================================================
             OCORRÊNCIAS
        ================================================== -->

        <div class="form-card">

            <div class="form-title">
                Ocorrências
            </div>


            <div
                class="occurrence-list"
                id="occurrenceList"
            ></div>


            <button
                class="add-occurrence"
                onclick="abrirEditorOcorrencia()"
            >
                + Adicionar ocorrência
            </button>



            <div
                class="occurrence-editor hidden"
                id="occurrenceEditor"
            >


               <!-- <select id="occurrenceType">

                    <option value="Prob. Mecânico">
                        Prob. Mecânico
                    </option>

                    <option value="Prob. Elétrico">
                        Prob. Elétrico
                    </option>

                    <option value="Prob. Eletromecânico">
                        Prob. Eletromecânico
                    </option>

                    <option value="Prob. em Matriz">
                        Prob. em Matriz
                    </option>

                    <option value="Prob. em Material">
                        Prob. em Material
                    </option>

                    <option value="Setup">
                        Setup
                    </option>

                    <option value="CTP">
                        CTP
                    </option>

                    <option value="Outro">
                        Outro
                    </option>

                </select> -->

                <select id="occurrenceType">
    <option value="Mecânico">Mecânico</option>
    <option value="Elétrico">Elétrico</option>
    <option value="Eletromecânico">Eletromecânico</option>
    <option value="Matriz">Matriz</option>
    <option value="Processo / Regulagem">Processo / Regulagem</option>
    <option value="Material">Material</option>
    <option value="CTP">CTP</option>
    <option value="Setup / Troca">Setup / Troca</option>
    <option value="Outro">Outro</option>
</select>



                <textarea
                    id="occurrenceDescription"
                    placeholder="Descreva a ocorrência..."
                ></textarea>



                <div class="editor-actions">

                    <button
                        class="editor-cancel"
                        onclick="cancelarEditorOcorrencia()"
                    >
                        Cancelar
                    </button>


                    <button
                        class="editor-save"
                        onclick="salvarOcorrenciaLocal()"
                    >
                        Salvar
                    </button>

                </div>


            </div>

        </div>



        <!-- =================================================
             SELETOR NATIVO DE HORÁRIO
        ================================================== -->

        <input
            type="time"
            id="nativeTimePicker"
            class="native-time-picker"
            step="60"
            aria-hidden="true"
        >



        <!-- =================================================
             AÇÕES
        ================================================== -->

        <button
            class="save-button"
            onclick="salvarMaquina()"
        >
            Salvar máquina
        </button>


        <button
            class="delete-machine hidden"
            id="deleteMachineButton"
            onclick="excluirMaquina()"
        >
            Excluir apontamento
        </button>


    </section>

</main>



<div
    class="toast"
    id="toast"
></div>



<div
    class="loading hidden"
    id="loading"
>

    <div class="loading-box">
        Carregando...
    </div>

</div>


<style>
    .custom-confirm-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(20, 25, 35, 0.42);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }

    .custom-confirm-overlay.hidden {
        display: none !important;
    }

    .custom-confirm-box {
        width: 100%;
        max-width: 360px;
        padding: 24px;
        border-radius: 20px;
        background: #FFFFFF;
        color: #1C1C1E;
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.20);
        animation: confirmAppear 0.18s ease-out;
    }

    .custom-confirm-icon {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        border-radius: 15px;
        background: #F2F2F7;
        color: #3A3A3C;
        font-size: 25px;
        font-weight: 600;
    }

    .custom-confirm-icon.danger {
        background: #FFF0F0;
        color: #D92D20;
    }

    .custom-confirm-title {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.3;
    }

    .custom-confirm-message {
        margin: 0;
        color: #636366;
        font-size: 15px;
        line-height: 1.5;
        overflow-wrap: anywhere;
    }

    .custom-confirm-actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
    }

    .custom-confirm-actions button {
        flex: 1;
        min-height: 46px;
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .custom-confirm-cancel {
        background: #F2F2F7;
        color: #1C1C1E;
    }

    .custom-confirm-accept {
        background: #176B45;
        color: #FFFFFF;
    }

    .custom-confirm-accept.danger {
        background: #D92D20;
    }

    .custom-confirm-actions button:focus-visible {
        outline: 3px solid #8AB4F8;
        outline-offset: 2px;
    }

    @keyframes confirmAppear {
        from {
            opacity: 0;
            transform: translateY(8px) scale(0.98);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .custom-confirm-box {
            animation: none;
        }
    }
</style>

<div
    id="customConfirm"
    class="custom-confirm-overlay hidden"
    aria-hidden="true"
>
    <section
        class="custom-confirm-box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="customConfirmTitle"
        aria-describedby="customConfirmMessage"
    >
        <div id="customConfirmIcon" class="custom-confirm-icon">
            ?
        </div>

        <h2 id="customConfirmTitle" class="custom-confirm-title">
            Confirmar ação
        </h2>

        <p id="customConfirmMessage" class="custom-confirm-message">
            Deseja continuar?
        </p>

        <div class="custom-confirm-actions">
            <button
                type="button"
                id="customConfirmCancel"
                class="custom-confirm-cancel"
            >
                Cancelar
            </button>

            <button
                type="button"
                id="customConfirmAccept"
                class="custom-confirm-accept"
            >
                Confirmar
            </button>
        </div>
    </section>
</div>


<script src="lider.js"></script>

</body>

</html>
